<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Loan Eligibility Calculator</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; }
    input[type="range"], input[type="number"] { width: 100%; }
    .results { margin-top: 30px; font-size: 1.2em; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Calculate Home Loan Eligibility</h2>

    <div class="input-group">
      <label>Gross Income (Monthly): ₹<span id="grossIncomeLabel">25000</span></label>
      <input type="range" min="10000" max="1000000" step="1000" value="25000" id="grossIncome">
    </div>

    <div class="input-group">
      <label>Tenure (Years): <span id="tenureLabel">23</span></label>
      <input type="range" min="1" max="30" value="23" id="tenure">
    </div>

    <div class="input-group">
      <label>Interest Rate (% p.a.): <span id="interestLabel">8.5</span>%</label>
      <input type="range" min="0.5" max="15" step="0.1" value="8.5" id="interestRate">
    </div>

    <div class="input-group">
      <label>Other EMIs (Monthly): ₹<span id="otherEMIsLabel">0</span></label>
      <input type="range" min="0" max="1000000" step="1000" value="0" id="otherEMIs">
    </div>

    <div class="results">
      <p>Your Home Loan Eligibility: ₹<span id="loanEligibility">0</span></p>
      <p>Your Home Loan EMI will be: ₹<span id="emiAmount">0</span> /month</p>
    </div>

    <button onclick="alert('Application process started!')">Apply Now</button>
  </div>

  <script>
    const grossIncome = document.getElementById('grossIncome');
    const tenure = document.getElementById('tenure');
    const interestRate = document.getElementById('interestRate');
    const otherEMIs = document.getElementById('otherEMIs');

    const grossIncomeLabel = document.getElementById('grossIncomeLabel');
    const tenureLabel = document.getElementById('tenureLabel');
    const interestLabel = document.getElementById('interestLabel');
    const otherEMIsLabel = document.getElementById('otherEMIsLabel');

    const loanEligibility = document.getElementById('loanEligibility');
    const emiAmount = document.getElementById('emiAmount');

    function calculate() {
      const income = parseFloat(grossIncome.value);
      const years = parseInt(tenure.value);
      const rate = parseFloat(interestRate.value);
      const other = parseFloat(otherEMIs.value);

      const maxEMI = income * 0.4 - other;
      const r = rate / 12 / 100;
      const n = years * 12;

      const eligibility = (maxEMI * (Math.pow(1 + r, n) - 1)) / (r * Math.pow(1 + r, n));
      const emi = maxEMI;

      grossIncomeLabel.textContent = income;
      tenureLabel.textContent = years;
      interestLabel.textContent = rate;
      otherEMIsLabel.textContent = other;

      loanEligibility.textContent = Math.round(eligibility).toLocaleString('en-IN');
      emiAmount.textContent = Math.round(emi).toLocaleString('en-IN');
    }

    grossIncome.oninput = calculate;
    tenure.oninput = calculate;
    interestRate.oninput = calculate;
    otherEMIs.oninput = calculate;

    // Initial calculation
    calculate();
  </script>
</body>
</html>
